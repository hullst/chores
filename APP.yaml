# APP.yaml — self-describing manifest. Source of truth for the App Catalog.
# After editing, regenerate the catalog:  cd ~/Documents/Claude/Projects && python3 build-catalog.py
schema_version: 1
name: Chore Board
slug: chores
one_liner: Hull Family Chore Board — a data-driven, installable PWA with a parent-login admin and a Firestore backend.
status: active
type: static-site
owner: Stephen Hull
created: 2026-05
updated: 2026-05-23

description: >
  An installable, offline-capable PWA chore tracker for the family. Moved from
  hand-edited HTML to a data-driven app (chore-engine.js) with a real admin panel
  (admin.html), parent login, and a Cloud Firestore backend (access controlled by
  firestore.rules). Client-side app + hosted database — no local server. Cloned
  into the fleet 2026-07-01 (was GitHub-only, no local checkout).

stack:
  - PWA (HTML/CSS/JS, service worker, manifest)
  - Google Cloud Firestore (backend + firestore.rules)

port: none

launchagents:
  - none

schedules:
  - none

entry_points:
  - index.html (the chore board)
  - admin.html (parent admin)
  - chore-engine.js (app logic)

data:
  - Cloud Firestore (remote; schema/rules in firestore.rules)

secrets:
  - Firebase web config is public by design; access is enforced by firestore.rules

docs_present:
  - CHANGELOG.md
  - ROADMAP.md
docs_missing: []

distribution: local+github
git_remote: https://github.com/hullst/chores.git
deploy: Firestore backend (rules in firestore.rules); static hosting target not committed to the repo — CONFIRM where it deploys (Firebase Hosting / Cloudflare Pages?)
tags:
  - pwa
  - family
  - firestore
  - chores

notable: >
  Backend is Firestore, not the fleet's usual JSON-on-disk — the one app in the
  fleet with a hosted database. Confirm/record the hosting target in deploy.
